<!doctype html><html lang="th"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T2PROJECT Admin Preview</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet"><style>body{font:16px Prompt,sans-serif;background:#f4f7fc;color:#18344e;margin:0}main{max-width:760px;margin:auto;padding:18px}section{background:#fff;border:1px solid #d8e2ef;border-radius:14px;padding:18px;margin:12px 0}input,button{font:inherit;box-sizing:border-box;min-height:48px;border-radius:10px;padding:10px}input{width:100%;border:1px solid #b7c5d4}button{background:#175ca5;color:white;border:0;margin:8px 6px 0 0}.muted{color:#586b7d}@media print{.controls{display:none}body{background:white}section{break-inside:avoid}}</style></head><body><main><h1>แดชบอร์ดแอดมิน</h1><p class="muted">ต้นแบบภายในเท่านั้น ยังไม่เชื่อม Login จริงและห้ามใช้รหัสเซสชันจริง</p><section class="controls"><label for="token">รหัสเซสชันทดสอบ</label><input id="token" type="password" autocomplete="off"><button id="summary">ดูภาพรวม</button><button id="quality">ตรวจสอบสลิป</button><label for="query">ค้นหาสมาชิกในพื้นที่รับผิดชอบ</label><input id="query" type="search"><button id="search">ค้นหา</button><button onclick="window.print()">พิมพ์</button></section><p id="status" role="status"></p><section id="overview"></section><section id="receiptStatus"></section><section id="qualityResults"></section><section class="controls"><h2>บันทึกสลิปใหม่</h2><label>รหัสสมาชิก<input id="memberId"></label><label>วันเวลาโอน<input id="transferAt" type="datetime-local"></label><label>จำนวนเงิน<input id="amount" type="number" min="0.01" step="0.01"></label><label>เลขอ้างอิง 6 หลัก<input id="ref6" maxlength="6" inputmode="numeric"></label><label>ผู้โอน<input id="sender"></label><label>ผู้รับ<input id="receiver"></label><label>หมายเหตุ<input id="note"></label><button id="saveSlip">บันทึกสลิป (รอตรวจสอบ)</button><button id="report">รายงานสลิป</button></section><div id="results"></div><div id="slips"></div><section id="reportResults"></section></main><script>const el=id=>document.getElementById(id);function run(method,args,done){const runner=google.script.run.withSuccessHandler(done).withFailureHandler(()=>el("status").textContent="ไม่สามารถอ่านข้อมูลได้");runner[method](...args)}el("quality").onclick=()=>{el("status").textContent="กำลังตรวจสอบ";run("t2SlipQualityReport",[el("token").value],d=>{if(!d||!d.ok){el("status").textContent="ตรวจสอบไม่ได้";return}const c=d.counts;el("qualityResults").textContent="สลิปทั้งหมด "+c.total+" | รอยืนยัน "+c.pending_verification+" | ยกเลิก "+c.deleted+" | จำนวนเงินผิดปกติ "+c.invalid_amount+" | เลขอ้างอิงผิด "+c.missing_reference+" | อาจซ้ำ "+c.duplicate_reference_time;el("status").textContent="ผลตรวจสอบเบื้องต้น ไม่ใช่การยืนยันจากธนาคาร"})};el("summary").onclick=()=>{run("t2ReceiptSummary",[el("token").value,""],r=>{if(r&&r.ok)el("receiptStatus").textContent="รอตรวจสอบ "+r.pending_count+" รายการ ("+Number(r.pending_amount).toLocaleString("th-TH")+" บาท) | สถานะตรวจแล้ว "+r.verified_count+" รายการ ("+Number(r.verified_amount).toLocaleString("th-TH")+" บาท) — สถานะตรวจแล้วไม่ใช่หลักฐานยืนยันจากธนาคาร"});el("status").textContent="กำลังโหลด";run("t2AdminSummary",[el("token").value],d=>{if(!d||!d.ok){el("status").textContent="ไม่มีสิทธิ์";return}el("overview").textContent="สมาชิก "+d.member_count+" คน | สลิป "+d.slip_count+" รายการ | ยอด "+Number(d.amount_total).toLocaleString("th-TH")+" บาท | ข้อมูลต้องตรวจ "+d.unverified_or_invalid+" รายการ";el("status").textContent="ยอดจากสลิป ไม่ใช่ยอดยืนยันโดยธนาคาร"})};function show(id,page){el("slips").replaceChildren();run("t2AdminSlipPage",[el("token").value,id,page],d=>{if(!d||!d.ok){el("status").textContent="ดูสลิปไม่ได้";return}const box=document.createElement("section"),head=document.createElement("strong");head.textContent="สลิปทั้งหมด "+d.total+" รายการ หน้า "+page;box.append(head);d.items.forEach(s=>{const p=document.createElement("p");p.textContent=s.transfer_at+" | "+s.amount+" บาท | "+s.reference_last6+" | "+s.sender+" → "+s.receiver;box.append(p)});if(page>1){const b=document.createElement("button");b.textContent="ก่อนหน้า";b.onclick=()=>show(id,page-1);box.append(b)}if(page*25<d.total){const b=document.createElement("button");b.textContent="ถัดไป";b.onclick=()=>show(id,page+1);box.append(b)}el("slips").append(box)})}el("search").onclick=()=>{el("results").replaceChildren();run("t2AdminFindMembers",[el("token").value,el("query").value],d=>{if(!d||!d.ok){el("status").textContent="ค้นหาไม่ได้";return}el("status").textContent="พบ "+d.total+" คน";d.items.forEach(m=>{const box=document.createElement("section"),name=document.createElement("strong"),b=document.createElement("button");name.textContent=m.full_name+" ("+m.room_id+")";b.textContent="ดูสลิป";b.onclick=()=>{el("memberId").value=m.member_id;show(m.member_id,1)};box.append(name,document.createTextNode(" "),b);el("results").append(box)})})};el("report").onclick=()=>{run("t2ReceiptReport",[el("token").value,{}],d=>{if(!d||!d.ok){el("status").textContent="ไม่สามารถเปิดรายงานได้";return}const box=el("reportResults");box.replaceChildren();const heading=document.createElement("h2");heading.textContent="รายงานสลิป "+d.total+" รายการ"+(d.truncated?" (แสดงไม่เกิน 1,000 รายการ)":"");box.append(heading);d.rows.forEach(r=>{const p=document.createElement("p");p.textContent=r.transfer_at+" | "+r.member_name+" | "+r.amount+" บาท | "+r.reference_last6+" | "+r.status;box.append(p)});el("status").textContent="รายงานนี้แสดงรายการสลิป ไม่ใช่หลักฐานยืนยันจากธนาคาร"})};el("saveSlip").onclick=()=>{const p={member_id:el("memberId").value.trim(),transfer_at:el("transferAt").value,amount:el("amount").value,reference_last6:el("ref6").value.trim(),sender:el("sender").value.trim(),receiver:el("receiver").value.trim(),note:el("note").value.trim()};if(!p.member_id||!p.transfer_at||!p.amount||!/^[0-9]{6}$/.test(p.reference_last6)||!p.sender||!p.receiver){el("status").textContent="กรุณากรอกข้อมูลให้ครบ";return}if(!confirm("ยืนยันบันทึกสลิปสถานะรอตรวจสอบ?"))return;const btn=el("saveSlip");btn.disabled=true;const runner=google.script.run.withSuccessHandler(d=>{btn.disabled=false;el("status").textContent=d&&d.ok?"บันทึกสลิปแล้ว รอการตรวจสอบ":"ไม่สำเร็จ: "+(d&&d.error||"UNKNOWN");if(d&&d.ok){el("ref6").value="";show(p.member_id,1)}}).withFailureHandler(()=>{btn.disabled=false;el("status").textContent="บันทึกไม่สำเร็จ"});runner.t2CreateSlip(el("token").value,p)};</script></body></html>
