<!doctype html><html lang="th"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T2PROJECT Owner Bank Review</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet"><style>body{font:17px Prompt,sans-serif;margin:0;background:#f1f5fb;color:#16334e}main{max-width:680px;margin:auto;padding:18px}h1{font-size:24px}.item{background:white;padding:18px;margin:14px 0;border-radius:14px;border:1px solid #d7e0ed;overflow-wrap:anywhere}button,input{font:inherit;min-height:50px;border-radius:10px;padding:10px;box-sizing:border-box}input{width:100%;border:1px solid #aebdd0}button{background:#165dab;color:white;border:0;margin:8px 5px 0 0}button:disabled{opacity:.5}.reject{background:#9c3434}p{line-height:1.5}</style></head><body><main><h1>ตรวจสอบคำขอบัญชีธนาคาร</h1><p>สำหรับ Owner เท่านั้น การอนุมัติไม่เปลี่ยนบัญชีรับเงินจริง</p><label for="token">รหัสเซสชัน Owner</label><input id="token" type="password" autocomplete="off" aria-describedby="sessionWarning"><p id="sessionWarning">หน้านี้เป็นต้นแบบสำหรับทดสอบภายในเท่านั้น ห้ามนำรหัสเซสชันจากระบบจริงมากรอกจนกว่าจะเชื่อมระบบ Login อย่างปลอดภัย</p><button id="load">โหลดคำขอ</button><p id="status" role="status"></p><div id="items"></div></main><script>
const el=id=>document.getElementById(id);
el("load").onclick=()=>{const token=el("token").value;if(!token)return;el("status").textContent="กำลังโหลด";google.script.run.withSuccessHandler(data=>{el("items").replaceChildren();if(!data||!data.ok){el("status").textContent="โหลดไม่สำเร็จ";return}el("status").textContent="รอตรวจสอบ "+data.items.length+" รายการ";data.items.forEach(x=>{const box=document.createElement("div");box.className="item";const title=document.createElement("strong");title.textContent="สมาชิก "+x.member_id;const detail=document.createElement("p");detail.textContent=x.bank_name+" •••• "+x.account_last4;box.append(title,detail);["approved","rejected"].forEach(decision=>{const btn=document.createElement("button");btn.textContent=decision==="approved"?"อนุมัติคำขอ":"ปฏิเสธ";if(decision==="rejected")btn.className="reject";btn.onclick=()=>{if(!confirm("ยืนยันการตัดสินใจ?"))return;box.querySelectorAll("button").forEach(b=>b.disabled=true);google.script.run.withSuccessHandler(r=>{if(r&&r.ok){box.remove();el("status").textContent="บันทึกสถานะแล้ว"}else{box.querySelectorAll("button").forEach(b=>b.disabled=false);el("status").textContent="บันทึกไม่สำเร็จ"}}).withFailureHandler(()=>{box.querySelectorAll("button").forEach(b=>b.disabled=false);el("status").textContent="เกิดข้อผิดพลาด"}).t2OwnerReviewBankRequest(token,x.request_id,decision)};box.append(btn)});el("items").append(box)})}).withFailureHandler(()=>el("status").textContent="ไม่สามารถอ่านรายการได้").t2OwnerBankQueue(token)};
</script></body></html>
