<!doctype html><html lang="th"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T2PROJECT Owner Summary</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#f4f7fc;color:#16314b;font:16px Prompt,sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{font-size:24px}input,button{font:inherit;padding:12px;border-radius:10px;min-height:48px;box-sizing:border-box}input{border:1px solid #a9bacb;width:100%;margin:6px 0}button{background:#165ba8;color:white;border:0}section{background:white;border:1px solid #dbe3ef;border-radius:14px;padding:15px;margin:12px 0}strong{font-size:18px}.muted{color:#52657a}p{margin:6px 0}@media print{.controls{display:none}body{background:white}section{break-inside:avoid}}</style></head><body><main><h1>สรุปสมาชิกสำหรับ Owner</h1><p class="muted">รายงานยอดสลิป ไม่รวมผลตอบแทนตามโปรโมชัน</p><div class="controls"><label for="session">รหัสเซสชัน Owner (ต้นแบบภายในเท่านั้น)</label><input id="session" type="password" autocomplete="off"><button id="load">แสดงรายงาน</button><button type="button" onclick="window.print()">พิมพ์</button></div><p id="status" role="status"></p><section id="totals" aria-label="ยอดรวมทั้งหมด"></section><p id="quality" role="status"></p><div id="members"></div></main><script>const el=id=>document.getElementById(id);el("load").onclick=()=>{const token=el("session").value;if(!token)return;el("status").textContent="กำลังโหลด";google.script.run.withSuccessHandler(data=>{el("members").replaceChildren();if(!data||!data.ok){el("status").textContent="ไม่สามารถแสดงรายงาน";return}el("status").textContent="แสดง "+data.items.length+" จาก "+data.total_members+" สมาชิก";el("totals").textContent="ยอดรวมสลิป "+Number(data.total_slips||0).toLocaleString("th-TH")+" รายการ | ยอดเงิน "+Number(data.total_amount||0).toLocaleString("th-TH")+" บาท";const q=data.quality||{};el("quality").textContent="ตรวจสอบข้อมูล: สลิปจับคู่ไม่ได้ "+(q.unmatched_slips||0)+" รายการ | จำนวนเงินผิดปกติ "+(q.invalid_amount_slips||0)+" รายการ";data.items.forEach(m=>{const card=document.createElement("section");const title=document.createElement("strong");title.textContent=m.full_name||m.member_id;const info=document.createElement("p");info.textContent="ห้อง "+m.room_id+" | สลิป "+m.slip_count+" รายการ | ยอดรวม "+Number(m.amount_total).toLocaleString("th-TH")+" บาท";card.append(title,info);el("members").append(card)})}).withFailureHandler(()=>el("status").textContent="โหลดข้อมูลไม่สำเร็จ").t2OwnerMemberSummary(token,200)};</script></body></html>
