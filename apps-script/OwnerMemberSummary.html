<!doctype html><html lang="th"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T2PROJECT Owner Summary</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#f4f7fc;color:#16314b;font:16px Prompt,sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{font-size:24px}input,button{font:inherit;padding:12px;border-radius:10px;min-height:48px;box-sizing:border-box}input{border:1px solid #a9bacb;width:100%;margin:6px 0}button{background:#165ba8;color:white;border:0}section{background:white;border:1px solid #dbe3ef;border-radius:14px;padding:15px;margin:12px 0}strong{font-size:18px}.muted{color:#52657a}p{margin:6px 0}@media print{.controls{display:none}body{background:white}section{break-inside:avoid}}</style></head><body><main><h1>สรุปสมาชิกสำหรับ Owner</h1><p class="muted">รายงานยอดสลิป ไม่รวมผลตอบแทนตามโปรโมชัน</p><div class="controls"><label for="session">รหัสเซสชัน Owner (ต้นแบบภายในเท่านั้น)</label><input id="session" type="password" autocomplete="off"><button id="load">แสดงรายงาน</button><button type="button" onclick="window.print()">พิมพ์</button></div><p id="status" role="status"></p><section id="totals" aria-label="ยอดรวมทั้งหมด"></section><p id="quality" role="status"></p><div class="controls"><label for="search">ค้นหาสมาชิก (ชื่อหรือรหัสสมาชิก)</label><input id="search" type="search" placeholder="พิมพ์ชื่ออย่างน้อย 2 ตัวอักษร"><button id="find">ค้นหา</button></div><div id="results"></div><div id="slips"></div><div id="members"></div></main><script>const el=id=>document.getElementById(id);el("load").onclick=()=>{const token=el("session").value;if(!token)return;el("status").textContent="กำลังโหลด";google.script.run.withSuccessHandler(data=>{el("members").replaceChildren();if(!data||!data.ok){el("status").textContent="ไม่สามารถแสดงรายงาน";return}el("status").textContent="แสดง "+data.items.length+" จาก "+data.total_members+" สมาชิก";el("totals").textContent="ยอดรวมสลิป "+Number(data.total_slips||0).toLocaleString("th-TH")+" รายการ | ยอดเงิน "+Number(data.total_amount||0).toLocaleString("th-TH")+" บาท";const q=data.quality||{};el("quality").textContent="ตรวจสอบข้อมูล: สลิปจับคู่ไม่ได้ "+(q.unmatched_slips||0)+" รายการ | จำนวนเงินผิดปกติ "+(q.invalid_amount_slips||0)+" รายการ | รหัสสมาชิกซ้ำ "+(q.duplicate_member_ids||0)+" รายการ";data.items.forEach(m=>{const card=document.createElement("section");const title=document.createElement("strong");title.textContent=m.full_name||m.member_id;const info=document.createElement("p");info.textContent="ห้อง "+m.room_id+" | สลิป "+m.slip_count+" รายการ | ยอดรวม "+Number(m.amount_total).toLocaleString("th-TH")+" บาท";card.append(title,info);el("members").append(card)})}).withFailureHandler(()=>el("status").textContent="โหลดข้อมูลไม่สำเร็จ").t2OwnerMemberSummary(token,200)};const showSlips=(id,offset=0)=>{const token=el("session").value;if(!token)return;el("slips").replaceChildren();el("status").textContent="กำลังโหลดสลิป";google.script.run.withSuccessHandler(data=>{if(!data||!data.ok){el("status").textContent="อ่านสลิปไม่สำเร็จ";return}el("status").textContent="แสดงสลิป "+data.items.length+" จาก "+data.total+" รายการ";const panel=document.createElement("section"),head=document.createElement("strong");head.textContent="สลิป: "+data.full_name+" ("+data.total+" รายการ)";panel.append(head);data.items.forEach(x=>{const p=document.createElement("p");p.textContent=(x.date||"ไม่ระบุวันที่")+" | "+x.amount+" บาท | "+x.status;panel.append(p)});if(offset>0){const prev=document.createElement("button");prev.textContent="ก่อนหน้า";prev.onclick=()=>showSlips(id,Math.max(0,offset-25));panel.append(prev)}if(offset+data.items.length<data.total){const next=document.createElement("button");next.textContent="ถัดไป";next.onclick=()=>showSlips(id,offset+25);panel.append(next)}el("slips").append(panel)}).withFailureHandler(()=>el("status").textContent="โหลดสลิปไม่สำเร็จ").t2OwnerMemberSlips(token,id,offset,25)};
el("find").onclick=()=>{const token=el("session").value,q=el("search").value.trim();if(!token||q.length<2){el("status").textContent="กรุณากรอกรหัสเซสชันและคำค้นอย่างน้อย 2 ตัวอักษร";return}el("results").replaceChildren();el("slips").replaceChildren();google.script.run.withSuccessHandler(data=>{if(!data||!data.ok){el("status").textContent="ค้นหาไม่สำเร็จ";return}el("status").textContent="พบ "+data.total_matches+" รายการ";data.items.forEach(m=>{const box=document.createElement("section"),name=document.createElement("strong"),btn=document.createElement("button");name.textContent=m.full_name+" | "+m.room_id;btn.textContent="ดูสลิป";btn.onclick=()=>showSlips(m.member_id,0);box.append(name,document.createTextNode(" "),btn);el("results").append(box)})}).withFailureHandler(()=>el("status").textContent="ค้นหาไม่สำเร็จ").t2OwnerFindMembers(token,q,50)};
</script></body></html>
