<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7faff"><title>T2Project</title><link rel="stylesheet" href="style.css?v=14"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>html,body,button,input,select,textarea,table{font-family:'Prompt',sans-serif!important}</style></head>
<body>
<header class="top"><div class="brand"><span class="brandMark">T2</span><b>T2Project</b></div></header>
<main class="loginShell"><section class="loginCard"><div class="loginLogo">T2</div><h1>เข้าสู่ระบบ</h1><div class="memberTag">MEMBER</div>
<div class="form">
<label>ประเภทสมาชิก<select id="memberType" onchange="switchMemberType()" style="width:100%;padding:14px;border:1px solid #dbe4f0;border-radius:14px;background:#fff;font-size:16px"><option value="thai">🇹🇭 สมาชิกไทย</option><option value="lao">🇱🇦 สมาชิก สปป.ลาว</option><option value="foreign">🌏 สมาชิกต่างประเทศ</option></select></label>
<label id="countryWrap" style="display:none">ประเทศ<input id="country" autocomplete="country-name" placeholder="ประเทศ" style="width:100%;box-sizing:border-box;padding:14px;border:1px solid #dbe4f0;border-radius:14px;font-size:16px"></label>
<label><span id="documentLabel">เลขบัตรประชาชน 13 หลัก</span><div class="inputBox"><span>▣</span><input id="citizenId" maxlength="13" inputmode="numeric" autocomplete="off" placeholder="เลขบัตรประชาชน"></div></label>
<label>ชื่อ-นามสกุล<div class="inputBox"><span>●</span><input id="fullName" autocomplete="name" placeholder="ชื่อ นามสกุล (ไม่ต้องใส่คำนำหน้า)"></div></label>
</div>
<button id="loginBtn" class="primary" onclick="memberSearch()">เข้าสู่ระบบ <span>›</span></button><div id="memberResult"></div>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e7edf5;text-align:center;font-size:14px"><a href="admin-login.html">เจ้าหน้าที่ Admin</a><span style="margin:0 10px;color:#b5bfcc">•</span><a href="owner.html">Owner</a></div>
</section></main><script src="app.js?v=13"></script></body></html>
