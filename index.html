<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7faff"><title>T2Project</title><link rel="stylesheet" href="style.css?v=34"></head>
<body>
<header class="top"><div class="brand"><span class="brandMark">T2</span><b>T2Project</b></div></header>
<main class="loginShell"><section class="loginCard"><div class="loginLogo">T2</div><h1>เข้าสู่ระบบ</h1><div class="memberTag">MEMBER</div>
<div class="form"><div style="margin-bottom:12px"><label><input type="radio" name="loginMode" value="password" checked onchange="switchLoginMode()"> เข้าระบบด้วย User + Password</label> <label><input type="radio" name="loginMode" value="activate" onchange="switchLoginMode()"> เปิดใช้งานครั้งแรก</label></div><div id="passwordLogin"><label>ชื่อผู้ใช้ (User)<div class="inputBox"><span>●</span><input id="memberUsername" autocomplete="username" placeholder="ชื่อผู้ใช้"></div></label><label>รหัสผ่าน (Password)<div class="inputBox"><span>🔒</span><input id="memberPassword" type="password" autocomplete="current-password" placeholder="รหัสผ่าน"><button type="button" aria-label="แสดงรหัสผ่าน" aria-pressed="false" onclick="t2TogglePassword('memberPassword',this)" style="flex:none;min-width:48px;min-height:44px;padding:6px 10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#183153;cursor:pointer">👁️ ดู</button></div></label></div><div id="recoverLogin" style="display:none"><p>กรอกชื่อผู้ใช้เพื่อแจ้งคำขอ จากนั้นติดต่อ Admin ประจำห้องเพื่อยืนยันตัวตนและรับรหัสรีเซ็ตอายุ 15 นาที</p><label>ชื่อผู้ใช้ (User)<div class="inputBox"><input id="resetUsername" autocomplete="username" placeholder="ชื่อผู้ใช้"></div></label><button type="button" class="primary" onclick="t2RequestRecovery()">ส่งคำขอรีเซ็ต</button><label>รหัสรีเซ็ตที่ได้จาก Admin<div class="inputBox"><input id="resetCode" autocomplete="one-time-code" placeholder="รหัส 32 ตัว"></div></label><label>ตั้งรหัสผ่านใหม่<div class="inputBox"><input id="resetPassword" type="password" autocomplete="new-password" placeholder="12 ตัวขึ้นไป มีภาษาอังกฤษและตัวเลข"></div></label><label>ยืนยันรหัสผ่านใหม่<div class="inputBox"><input id="resetConfirm" type="password" autocomplete="new-password"></div></label><button type="button" class="primary" onclick="t2FinishRecovery()">ตั้งรหัสผ่านใหม่</button><button type="button" onclick="t2ToggleRecovery(false)">กลับไปเข้าสู่ระบบ</button><div id="resetResult" aria-live="polite"></div></div><div id="activateLogin" style="display:none">
<label>ประเภทสมาชิก<select id="memberType" onchange="switchMemberType()" style="width:100%;padding:14px;border:1px solid #dbe4f0;border-radius:14px;background:#fff;font-size:16px"><option value="thai">🇹🇭 สมาชิกไทย</option><option value="lao">🇱🇦 สมาชิก สปป.ลาว</option><option value="foreign">🌏 สมาชิกต่างประเทศ</option></select></label>
<label id="countryWrap" style="display:none">ประเทศ<input id="country" autocomplete="country-name" placeholder="ประเทศ" style="width:100%;box-sizing:border-box;padding:14px;border:1px solid #dbe4f0;border-radius:14px;font-size:16px"></label>
<label><span id="documentLabel">เลขบัตรประชาชน 13 หลัก</span><div class="inputBox"><span>▣</span><input id="citizenId" maxlength="13" inputmode="numeric" autocomplete="off" placeholder="เลขบัตรประชาชน"></div></label>
<label>ชื่อ-นามสกุล<div class="inputBox"><span>●</span><input id="fullName" autocomplete="name" placeholder="ชื่อ นามสกุล (ไม่ต้องใส่คำนำหน้า)"></div></label>
<label>รหัสเปิดใช้งานจากแอดมิน<div class="inputBox"><input id="activationCode" autocomplete="off" placeholder="รหัสที่ได้รับหลังอนุมัติ"></div></label><label>ตั้งชื่อผู้ใช้ (User)<div class="inputBox"><input id="newUsername" autocomplete="username" placeholder="ภาษาอังกฤษ 6-30 ตัว"></div></label><label>ตั้งรหัสผ่าน<div class="inputBox"><input id="newPassword" type="password" autocomplete="new-password" placeholder="อย่างน้อย 12 ตัว มีตัวอักษรและตัวเลข"><button type="button" aria-label="แสดงรหัสผ่าน" aria-pressed="false" onclick="t2TogglePassword('newPassword',this)" style="flex:none;min-width:48px;min-height:44px;padding:6px 10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#183153;cursor:pointer">👁️ ดู</button></div></label><label>ยืนยันรหัสผ่าน<div class="inputBox"><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="กรอกรหัสผ่านซ้ำ"><button type="button" aria-label="แสดงรหัสผ่าน" aria-pressed="false" onclick="t2TogglePassword('confirmPassword',this)" style="flex:none;min-width:48px;min-height:44px;padding:6px 10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#183153;cursor:pointer">👁️ ดู</button></div></label></div></div>
<button id="loginBtn" class="primary" onclick="memberSearch()">เข้าสู่ระบบ <span>›</span></button><div id="memberResult"></div>
<div style="margin-top:20px;padding-top:16px;border-top:1px solid #e7edf5;text-align:center;font-size:14px"><a href="#" onclick="t2ToggleRecovery();return false">ลืมรหัสผ่าน?</a><span style="margin:0 10px;color:#b5bfcc">•</span><a href="admin-login.html">เจ้าหน้าที่ Admin</a><span style="margin:0 10px;color:#b5bfcc">•</span><a href="owner.html">Owner</a></div>
</section></main><script src="app.js?v=21"></script><script>
function t2TogglePassword(id,btn){
 const field=document.getElementById(id);if(!field)return;
 const show=field.type==='password';field.type=show?'text':'password';
 btn.textContent=show?'🙈 ซ่อน':'👁️ ดู';
 btn.setAttribute('aria-label',show?'ซ่อนรหัสผ่าน':'แสดงรหัสผ่าน');
 btn.setAttribute('aria-pressed',String(show));
}
</script></body></html>
