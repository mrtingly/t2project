<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T2PROJECT Passkey Test</title><style>body{font-family:system-ui,sans-serif;max-width:520px;margin:30px auto;padding:18px}input,button{font-size:18px;padding:12px;width:100%;box-sizing:border-box;margin:8px 0}button{background:#134c9c;color:white;border:0;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:14px;border-radius:8px}</style></head><body><h2>ทดสอบ Passkey (ไม่กระทบ Login เดิม)</h2><label>รหัสสมาชิกทดสอบ</label><input id="userId" autocomplete="off" placeholder="test001"><label>รหัสทดสอบที่ตั้งไว้ใน Worker (เฉพาะลงทะเบียน)</label><input id="secret" type="password" autocomplete="off"><button id="register">ลงทะเบียน Passkey</button><button id="login">ทดสอบยืนยันตัวตน Passkey</button><pre id="status">พร้อมทดสอบ</pre><script type="module">import {startRegistration,startAuthentication} from 'https://esm.sh/@simplewebauthn/browser@13.2.2';const endpoint='https://t2project-passkey.mrtingly1.workers.dev';const status=document.getElementById('status');async function call(action,extra={}){const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,userId:document.getElementById('userId').value.trim(),...extra})});const data=await r.json();if(!r.ok||!data.ok)throw Error(data.message||'HTTP '+r.status);return data}async function run(mode){status.textContent='กำลังดำเนินการ...';try{if(mode==='register'){const testSecret=document.getElementById('secret').value;const begin=await call('registerBegin',{testSecret});const response=await startRegistration({optionsJSON:begin.options});await call('registerFinish',{testSecret,response});status.textContent='ลงทะเบียน Passkey สำเร็จ (เฉพาะระบบทดสอบ)'}else{const begin=await call('authBegin');const response=await startAuthentication({optionsJSON:begin.options});const done=await call('authFinish',{response});status.textContent=done.passkeyVerified?'ยืนยัน Passkey สำเร็จ (ยังไม่ใช่การ Login ระบบจริง)':'ยืนยันไม่สำเร็จ'}}catch(e){status.textContent='ผิดพลาด: '+e.message}}document.getElementById('register').onclick=()=>run('register');document.getElementById('login').onclick=()=>run('login');</script></body></html>
