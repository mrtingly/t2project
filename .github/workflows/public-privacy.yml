name: Public surface checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public files for sensitive values
        run: node scripts/check-public-privacy.cjs
