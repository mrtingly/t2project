<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7faff"><title>ตั้งรหัสผ่านใหม่ | T2Project</title><link rel="stylesheet" href="style.css?v=15"></head><body>
<header class="top"><div class="brand"><span class="brandMark">T2</span><b>T2Project</b></div></header>
<main class="loginShell"><section class="loginCard"><div class="loginLogo">T2</div><h1>ตั้งรหัสผ่านใหม่</h1><p>ลิงก์นี้ใช้สำหรับเจ้าของบัญชีที่ขอเปลี่ยนรหัสผ่านเท่านั้น</p><div class="form"><label>รหัสผ่านใหม่<div class="inputBox"><span>●</span><input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="อย่างน้อย 8 ตัวอักษร"></div></label><label>ยืนยันรหัสผ่าน<div class="inputBox"><span>●</span><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="กรอกรหัสอีกครั้ง"></div></label></div><button id="resetBtn" class="primary" onclick="resetPassword()">บันทึกรหัสผ่านใหม่ <span>›</span></button><div id="resetResult"></div><a href="index.html" class="forgotLink">กลับหน้าเข้าสู่ระบบ</a></section></main><script src="reset-password.js?v=1"></script></body></html>
